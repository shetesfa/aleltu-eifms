<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ከመስመር ውጭ</title>
<style>
  body{font-family:sans-serif;background:#f4f6f1;color:#24291f;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:20px;box-sizing:border-box}
  .box{max-width:340px}
  h1{font-size:20px;margin-bottom:8px}
  p{font-size:15px;color:#555}
  button{margin-top:16px;padding:12px 20px;border:none;border-radius:8px;background:#2b5c33;color:#fff;font-size:15px}
</style>
</head>
<body>
  <div class="box">
    <div style="font-size:40px">📶</div>
    <h1>ኢንተርኔት ግንኙነት የለም</h1>
    <p>እባክዎ ኢንተርኔትዎን ያረጋግጡ እና እንደገና ይሞክሩ። የገባ መረጃ ኢንተርኔት እስኪመለስ ድረስ አይላክም።</p>
    <button onclick="location.reload()">እንደገና ሞክር</button>
  </div>
</body>
</html>
